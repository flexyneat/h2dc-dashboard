name: Release HACS artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and repair"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # Pin every executable action to an immutable revision.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Recovery runs must build the immutable tag, not the workflow branch.
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) { throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package v${p.version}`); }'
      - run: npm run verify
      - name: Verify HACS release artifact contract
        run: npm run verify:release
      - name: Create checksums
        run: sha256sum dist/h2dc-dashboard.js > dist/SHA256SUMS
      - name: Attest public artifact
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/h2dc-dashboard.js
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/h2dc-dashboard.js dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/h2dc-dashboard.js dist/SHA256SUMS --verify-tag --notes-file docs/RELEASE_NOTES.md
          fi
